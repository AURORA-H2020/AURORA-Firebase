name: Test Firestore Rules

on:
  workflow_dispatch:
  push:
    paths:
      - "security-rules/**"

jobs:
  test:
    name: Test Firestore Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: security-rules/tests/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Firebase Emulator Binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.33.0
      - name: Install Firestore Rules Tests Dependencies
        run: npm ci
        working-directory: security-rules/tests
      - name: Run Tests
        run: npm run test-firestore-security-rules
        working-directory: security-rules/tests
